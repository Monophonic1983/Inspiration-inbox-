<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Inspiration Inbox Prototype</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Instrument-panel look. Layout: a raised home panel over a side drawer (Inbox, Calendar, Todos, Organize, Settings).
   Type: IBM Plex Sans (light for titles, regular for content) and IBM Plex Mono for labels, values and time.
   Waveform: dense 1px verticals, bottom-anchored, fading at the top and sides. Colour: pure white or black, flat neutral surfaces, purple as the only accent. */
:root {
  --stage: #DADADF; --bg: #FFFFFF; --drawer: #F4F3F8; --card: #F3F3F5; --card2: #E9E9ED; --line: rgba(10,10,20,.1);
  --ink: #0A0A0C; --ink2: #6A6A72; --ink3: #A3A3AB; --acc: #7C3AED; --on-acc: #FFFFFF; --hot: #C026D3; --grid: rgba(20,10,60,.06);
  --sans: "IBM Plex Sans", "Noto Sans SC", -apple-system, "PingFang SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, "Noto Sans SC", monospace;
  --ease: cubic-bezier(.2,.8,.2,1); --r: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --stage: #202024; --bg: #000000; --drawer: #060607; --card: #141414; --card2: #1E1E1E; --line: rgba(255,255,255,.09);
    --ink: #EDEDED; --ink2: #8D8D94; --ink3: #5B5B62; --acc: #A78BFA; --on-acc: #12062B; --hot: #E879F9; --grid: rgba(255,255,255,.05); color-scheme: dark; }
}
:root[data-theme="dark"] { --stage: #202024; --bg: #000000; --drawer: #060607; --card: #141414; --card2: #1E1E1E; --line: rgba(255,255,255,.09);
  --ink: #EDEDED; --ink2: #8D8D94; --ink3: #5B5B62; --acc: #A78BFA; --on-acc: #12062B; --hot: #E879F9; --grid: rgba(255,255,255,.05); color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [contenteditable]:focus-visible { outline: 1.5px solid var(--acc); outline-offset: 3px; border-radius: var(--r); }
.mono { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); font-weight: 400; }
#stage { height: 100%; display: grid; place-items: center; background: var(--bg); }
#phone { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--drawer); }
#sbar { display: none; }
@media (min-width: 560px) {

  #phone { width: 390px; height: min(844px, 100%); border-radius: 50px; box-shadow: 0 0 0 9px #0A0A0B, 0 0 0 10px rgba(255,255,255,.1), 0 40px 90px rgba(0,0,0,.4); }
  #sbar { display: flex; position: absolute; top: 0; left: 0; right: 0; height: 48px; justify-content: space-between; align-items: flex-end; padding: 0 32px 6px; font: 500 12px var(--mono); z-index: 90; pointer-events: none; }
}

/* drawer */
#drawer { position: absolute; inset: 0; padding: calc(20px + env(safe-area-inset-top, 0px)) 28px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; background: var(--drawer); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 14px 14px; }
@media (min-width: 560px) { #drawer { padding-top: 64px; } }
.brand { align-self: flex-start; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }
.dnav { display: flex; flex-direction: column; gap: 2px; }
.ditem { display: flex; align-items: center; height: 58px; width: 236px; font: 300 32px/1 var(--sans); letter-spacing: -.02em; color: var(--ink3); transition: color .25s, transform .4s var(--ease); position: relative; }
.ditem[aria-current="true"] { color: var(--ink); }
.ditem[aria-current="true"]::before { content: ""; position: absolute; left: -16px; top: 21px; width: 6px; height: 6px; background: var(--acc); }
.ditem .n { font: 400 11px var(--mono); letter-spacing: .1em; color: var(--ink3); margin-left: auto; align-self: center; }
.dfoot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }

/* home panel */
#home { position: absolute; inset: 0; background: var(--bg); overflow: hidden; transform-origin: left center; touch-action: pan-y; will-change: transform;
  transform: translateX(calc(var(--d, 0) * 296px)) scale(calc(1 - var(--d, 0) * .09)); border-radius: calc(var(--d, 0) * 6px);
  box-shadow: 0 0 0 1px rgba(128,128,150,calc(var(--d, 0) * .25)), -30px 0 60px rgba(0,0,0,calc(var(--d, 0) * .35)); transition: transform .45s var(--ease), border-radius .45s var(--ease), box-shadow .45s; }
#home.drag { transition: none; } #phone.dopen #home { --d: 1; }
#shade { position: absolute; inset: 0; z-index: 25; display: none; } #phone.dopen #shade { display: block; }
.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top, 0px)) 8px 0; background: linear-gradient(var(--bg) 72%, transparent); height: calc(66px + env(safe-area-inset-top, 0px)); }

.hero { padding: 6px 20px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

.opt2 .ct { margin-left: auto; color: var(--ink3); letter-spacing: .04em; }

/* cards: flat, light type, striped waveform */
.cards { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

.row[data-dir="r"] .bg { background: var(--acc); color: var(--on-acc); } .row[data-dir="l"] .bg { background: var(--card2); color: var(--ink2); justify-content: flex-end; }

.card.dash { background: none; box-shadow: inset 0 0 0 1px var(--line); }
.card .top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }

.dur { font: 400 12px var(--mono); letter-spacing: .06em; color: var(--ink2); flex: none; padding-top: 4px; }
.mini { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin-top: 16px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }

.pulse { animation: pulse 1.5s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .35; } }
.empty { padding: 20px; color: var(--ink2); font-size: 15px; max-width: 32ch; }

/* dock (home) and pills */
#dock { position: absolute; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 12; height: 68px; border-radius: var(--r); padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 14px 40px rgba(0,0,0,.18); transition: transform .3s var(--ease), opacity .3s; }

.micico { width: 20px; height: 20px; color: var(--ink2); flex: none; } .micico * { stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.pill.acc { background: var(--acc); color: var(--on-acc); }
.pill .sq { width: 11px; height: 11px; background: currentColor; display: block; } .pill .rd { width: 9px; height: 9px; border-radius: var(--r); background: currentColor; display: block; }

/* calendar: thermal heat map */
.ov { padding: 0 20px 6px; } .ov .mlabels { position: relative; height: 14px; margin-bottom: 4px; }
.ov .mlabels span { position: absolute; top: 0; font: 400 9.5px var(--mono); letter-spacing: .06em; color: var(--ink3); white-space: nowrap; text-transform: uppercase; }
.strip { display: flex; gap: 3px; } .strip .col { display: flex; flex-direction: column; gap: 3px; }

.h0 { background: var(--card2); }
.h1 { background: color-mix(in srgb, var(--acc) 26%, var(--card2)); }
.h2 { background: color-mix(in srgb, var(--acc) 58%, var(--card2)); }
.h3 { background: var(--acc); }
.h4 { background: color-mix(in srgb, var(--hot) 70%, var(--acc)); }
.sel { box-shadow: 0 0 0 1.5px var(--ink); }
.calnav { display: flex; align-items: center; justify-content: space-between; padding: 18px 12px 8px 20px; }
.calnav b { font: 300 22px var(--sans); letter-spacing: -.01em; } .calnav .nb { display: flex; gap: 2px; align-items: center; }

.dow, .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 0 16px; } .dow { padding-bottom: 6px; }

.day .c { font-size: 9px; opacity: .85; align-self: flex-end; }
.cmap { padding: 16px 20px 0; } .cmap .bar { height: 10px; border-radius: var(--r); background: linear-gradient(90deg, var(--card2), color-mix(in srgb, var(--acc) 40%, var(--card2)), var(--acc), var(--hot)); }

.dayhead { padding: 22px 20px 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 12px; } .dayhead b { font: 300 22px var(--sans); letter-spacing: -.01em; }
.readout { background: var(--ink); color: var(--bg); font: 500 10.5px var(--mono); letter-spacing: .04em; padding: 5px 9px; white-space: nowrap; } .readout i { font-style: normal; opacity: .55; }

.task.done .tt { color: var(--ink3); text-decoration: line-through; }
.seg { display: inline-flex; padding: 3px; border-radius: var(--r); background: var(--card); } .seg button { height: 34px; min-width: 56px; padding: 0 12px; border-radius: var(--r); font: 400 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); text-align: center; white-space: nowrap; }

.btn { height: 36px; padding: 0 14px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line); font: 400 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; text-align: center; white-space: nowrap; }
.btn.solid { background: var(--acc); box-shadow: none; color: var(--on-acc); }

.screen { position: absolute; inset: 0; background: var(--bg); z-index: 40; }
#thought { transform: translateX(100%); transition: transform .45s var(--ease); overflow-y: auto; } #thought.open { transform: none; }

.wavecard canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 150px; display: block; touch-action: none; cursor: pointer; }
.wtop { position: absolute; left: 20px; right: 20px; top: 18px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.stat { display: inline-flex; align-items: center; gap: 8px; font: 400 14px var(--sans); color: var(--ink2); } .stat i { width: 6px; height: 6px; border-radius: var(--r); background: var(--acc); }

.panel { margin-top: 8px; border-radius: var(--r); background: var(--card); padding: 22px 20px 12px; }

.dmeta { margin-bottom: 14px; }

.tg.type { background: var(--acc); box-shadow: none; color: var(--on-acc); } .tg.add { box-shadow: inset 0 0 0 1px var(--ink3); border-radius: var(--r); color: var(--ink3); }
.tabs { display: flex; gap: 22px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.tabs button { height: 44px; font: 400 15px var(--sans); color: var(--ink3); position: relative; } .tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acc); }
.prose { padding: 16px 0 14px; font: 400 17px/1.7 var(--sans); outline: none; white-space: pre-wrap; }
.ln { display: block; width: 100%; padding: 14px 0 6px; text-align: left; } .ln .ts { display: flex; gap: 10px; align-items: center; font: 400 13px var(--mono); color: var(--ink2); margin-bottom: 4px; } .ln .ts i { width: 5px; height: 5px; border-radius: var(--r); background: var(--ink3); }
.ln p { margin: 0; font: 400 16px/1.55 var(--sans); } .ln.on .ts { color: var(--acc); } .ln.on .ts i { background: var(--acc); }
.todos { padding: 6px 0 4px; }

/* capture */
#capture { z-index: 60; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .3s; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0; background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 14px 14px; }
@media (min-width: 560px) { #capture { padding-top: 56px; } }
#capture.on { opacity: 1; pointer-events: auto; }
#capture .wavecard { height: 230px; flex: none; } #capture .wavecard canvas { height: 170px; cursor: default; }
#capture .panel { flex: 1; min-height: 0; margin-top: 8px; display: flex; flex-direction: column; overflow: hidden; }
#tx { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
#tx .ph { color: var(--ink3); font-size: 17px; }
.bar2 { flex: none; margin: 8px 0 calc(16px + env(safe-area-inset-bottom, 0px)); height: 68px; border-radius: var(--r); background: var(--card); padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 12px; }

/* settings: flat rows with hairlines */
.sg { margin: 0 0 8px; } .sg > .mono { padding: 14px 20px 6px; display: block; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 56px; padding: 8px 20px; font-size: 16px; border-top: 1px solid var(--line); }
.srow > span:first-child { min-width: 0; } .srow small { display: block; color: var(--ink2); font-size: 12.5px; line-height: 1.4; }
.sw { width: 42px; height: 24px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--ink3); position: relative; flex: none; transition: background .25s; }
.sw::after { content: ""; position: absolute; top: 5px; left: 5px; width: 14px; height: 14px; border-radius: var(--r); background: var(--ink3); transition: transform .3s var(--ease), background .25s; }
.sw[aria-checked="true"] { background: var(--acc); box-shadow: none; } .sw[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-acc); }
.step { display: inline-flex; align-items: center; gap: 4px; } .step button { width: 40px; height: 36px; border-radius: var(--r); background: var(--card); font: 400 16px var(--mono); text-align: center; } .step b { min-width: 58px; text-align: center; font: 400 13px var(--mono); }
.bar { height: 2px; background: var(--line); margin: 0 0 10px; } .bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s linear; }
.note { color: var(--ink2); font-size: 12.5px; line-height: 1.5; padding: 10px 20px 0; }

/* sheets, tags and rules, toast */
.scrim { position: absolute; inset: 0; z-index: 100; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; } .scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 101; background: var(--bg); box-shadow: 0 -1px 0 var(--line); border-radius: var(--r); transform: translateY(105%); transition: transform .45s var(--ease); padding: 20px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 86%; overflow-y: auto; }
.sheet.on { transform: none; } .sheet h2 { margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
