name: CI
on: [push, pull_request]
jobs:
  packages:
    runs-on: macos-26
    strategy:
      matrix:
        package: [DesignSystem, Persistence, ModelStore, IntelligenceKit, CaptureKit]
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: swift test
